function advanceRunners(kind){const s=learnState;if(kind==='walk'){if(s.bases[0]&&s.bases[1]&&s.bases[2])s.runs++;s.bases[2]=s.bases[2]||(s.bases[0]&&s.bases[1]);s.bases[1]=s.bases[1]||s.bases[0];s.bases[0]=true;}else if(kind==='single'){if(s.bases[2])s.runs++;s.bases=[true,s.bases[0],s.bases[1]];}}
function applyUmpireEvent(e){const s=learnState;if(e.kind==='pitch'){if(e.answer==='볼'){s.balls++;if(s.balls===4){advanceRunners('walk');s.balls=0;s.strikes=0}}else{s.strikes++;if(s.strikes===3){s.outs++;s.balls=0;s.strikes=0}}}else if(e.kind==='foul'){s.strikes=Math.min(2,s.strikes+1)}else if(e.play==='safe'){advanceRunners('single');s.balls=0;s.strikes=0;}else if(e.play==='tag'){s.outs++;s.bases[0]=false;s.balls=0;s.strikes=0;}else if(e.play==='fly'){s.outs++;s.balls=0;s.strikes=0;} }

function averages(role){const metrics=role==='overall'?TEAM_OVERVIEW_METRICS:role==='hitter'?HITTER_METRICS:PITCHER_METRICS;return Object.fromEntries(metrics.map(([k])=>[k,TEAMS.reduce((n,t)=>n+TEAM_STATS[t.id][k],0)/TEAMS.length]))}

function bulletCells(t,role){const avg=averages(role),metrics=role==='overall'?TEAM_OVERVIEW_METRICS:role==='hitter'?HITTER_METRICS:PITCHER_METRICS;return metrics.map(([k,label,dir,desc])=>{const s=TEAM_STATS[t.id][k],all=TEAMS.map(u=>TEAM_STATS[u.id][k]),max=Math.max(...all)*1.12,best=LOW.includes(k)?Math.min(...all):Math.max(...all);return `<button class="chart-cell metric-cell ${state.metric===k?'active':''}" style="${styleTeam(t)}" data-metric="${k}" title="${desc}"><div class="metric-head"><span class="metric-name">${label}</span><span class="metric-desc">${dir}</span></div><div class="metric-number">${fmt(k,s)}</div><div class="bullet-track"><span class="bullet-fill" style="width:${Math.max(2,100*s/max)}%"></span><span class="bullet-average" style="left:${100*avg[k]/max}%"></span><span class="bullet-best" style="left:${Math.min(99,100*best/max)}%"></span></div><div class="bullet-labels"><span>리그 평균 ${fmt(k,avg[k])}</span><span>최고 ${fmt(k,best)}</span></div></button>`}).join('')}

function vsContributor(t,k){const group=['era','whip','k','ha','hra','bba'].includes(k)?'pitcher':'hitter';let list=PLAYERS.filter(p=>p.had2026&&p.team===t.id&&p.role===group);const playerKey={stolen:'hits',dp:'hits',errors:'error',runs:'rbi',allowed:'era',wpct:'wins'}[k]||k;
 list=list.filter(p=>Number.isFinite(p[playerKey]));if(!list.length)return '선수별 기여 확인 전';list.sort((a,b)=>LOW.includes(playerKey)?a[playerKey]-b[playerKey]:b[playerKey]-a[playerKey]);return list[0].name+' (예시)';}
const VS_PITCHES=[

function vsHomeRunField(p){
 const balls=sampleHomeRuns(p).slice(0,Math.min(20,p.hr));
 const directions={좌측:-39,좌중간:-20,중앙:0,우중간:20,우측:39};
 const markers=balls.map((b,i)=>{
  const theta=(-90+directions[b.dir])*Math.PI/180;
  const r=125+(b.d-100)*1.4;
  const jitter=(hash(p.id+'vsj'+i)%13)-6;
  const x=220+Math.cos(theta)*r+jitter,y=278+Math.sin(theta)*r+jitter/2;
  return `<g class="vs-homer-marker" style="--ball-delay:${Math.min(i*.14,2.3)}s" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="9" fill="#fff" stroke="#c93245" stroke-width="1.8"/><path d="M-6 -4 Q-2 0 -6 4 M6 -4 Q2 0 6 4" stroke="#c93245" stroke-width="1" fill="none"/><text text-anchor="middle" dy="3" font-size="8" font-weight="800" fill="#223d5a">${b.num}</text><title>${b.num}호 홈런 · ${b.dir} · ${b.d}m · 예시</title></g>`;
 }).join('');
 return `<div class="vs-field-wrap"><div class="vs-visual-heading">홈런 분포 <span class="tiny muted">방향·비거리 예시</span></div><svg class="vs-homer-field" viewBox="0 0 440 300" role="img" aria-label="${safe(p.name)} 홈런공 순차 표시 시연"><path d="M220 278 L20 95 Q220 -68 420 95 Z" fill="#d6e8d4" stroke="#93b7a1" stroke-width="2"/><path d="M220 278 L44 110 Q220 -18 396 110 Z" fill="#9dce9e"/><path d="M220 278 L124 185 Q220 133 316 185 Z" fill="#d6b99a"/><path d="M220 278 L204 261 L220 246 L236 261 Z" fill="#faf9f5" stroke="#927f6e"/><path d="M220 278 L20 95 M220 278 L420 95" stroke="#fff" stroke-width="2" opacity=".8"/><text x="220" y="292" font-size="10" fill="#58735e" text-anchor="middle">홈플레이트</text>${markers}</svg></div>`;
}

 const top=view==='top';

 <svg viewBox="0 0 370 220" class="vs-pitch-svg" role="img" aria-label="${top?'위에서 본':'옆에서 본'} 구종별 공 궤적 시연"><rect width="370" height="220" rx="12" fill="#f1f5fa"/><g stroke="#dce3ed" stroke-dasharray="5 5"><path d="M20 103 H349"/><path d="M30 25 V184"/><path d="M346 25 V184"/></g><rect x="332" y="69" width="27" height="83" rx="5" fill="white" stroke="#c7d1df"/><text x="25" y="203" fill="#8290a3" font-size="11">투수</text><text x="314" y="203" fill="#8290a3" font-size="11">포수</text>${VS_PITCHES.filter(x=>selected.includes(x.id)).map((x,i)=>`<path id="vsp${p.id}${x.id}" class="vs-trajectory" d="${coords[x.id]}" stroke="${x.color}" fill="none" stroke-width="3.2" stroke-linecap="round" style="--trail-delay:${i*.12}s"/><circle r="5.2" fill="#fff" stroke="${x.color}" stroke-width="2"><animateMotion dur="2.8s" begin="${(i*.14).toFixed(2)}s" repeatCount="indefinite" path="${coords[x.id]}"/></circle>`).join('')}</svg><div class="vs-trajectory-note">구종별 움직임은 유형별 도식이며 실제 선수 투구 추적 데이터가 아님.</div></div>`;

function vsTopPlayers(t,role){
 const r=role==='pitcher'?'pitcher':'hitter',metric=r==='pitcher'?'k':'hr';
 const entries=PLAYERS.filter(p=>p.had2026&&p.team===t.id&&p.role===r).sort((a,b)=>b[metric]-a[metric]).slice(0,3);
 const chosen=entries.find(p=>p.id===state.vsSelected[t.id])||entries[0];

function vsDetails(a,b){
 const s1=TEAM_STATS[a.id],s2=TEAM_STATS[b.id],selected=state.vsMode,role=state.vsRole;
 const common=[['wpct','승률',false],['runs','득점',false],['allowed','실점',true],['era','평균자책점',true],['hits','안타',false],['hr','홈런',false],['stolen','도루',false],['so','삼진',true],['dp','병살',true],['errors','실책',true]];
 const hitters=[['avg','타율',false],['hits','안타',false],['hr','홈런',false],['stolen','도루',false],['bb','볼넷',false],['so','삼진',true],['dp','병살',true],['errors','실책',true],['ops','OPS',false]];
 const pitchers=[['era','평균자책점',true],['k','탈삼진',false],['ha','피안타',true],['hra','피홈런',true],['bba','볼넷 허용',true],['whip','WHIP',true]];
 const fields=role==='all'?common:role==='hitter'?hitters:pitchers;
 let hs1=7+hash(a.id+b.id)%8,hs2=7+hash(b.id+a.id)%8;
 return `<div class="inline-controls" style="justify-content:center"><button class="pill ${selected==='all'?'active':''}" data-vs-mode="all">전체 보기</button><button class="pill ${selected==='h2h'?'active':''}" data-vs-mode="h2h">맞대결 기록</button><button class="pill ${selected==='season'?'active':''}" data-vs-mode="season">시즌 전체 기록</button></div>${selected!=='season'?`<div class="note-box" style="text-align:center;margin:12px 0">맞대결 (예시) <b>${a.id} ${hs1}승 · ${hs2}승 ${b.id}</b></div>`:''}${selected!=='h2h'?`<div class="inline-controls" style="justify-content:center;margin:17px 0"><button class="pill ${role==='all'?'active':''}" data-vs-role="all">전체</button><button class="pill ${role==='hitter'?'active':''}" data-vs-role="hitter">타자</button><button class="pill ${role==='pitcher'?'active':''}" data-vs-role="pitcher">투수</button></div>${comparisonMotion(role)}<div class="vs-metrics">${fields.map(([k,label,low])=>{
 const v1=s1[k],v2=s2[k],max=Math.max(v1,v2,0.001)*1.13,w1=100*v1/max,w2=100*v2/max,win1=low?v1<v2:v1>v2,win2=low?v2<v1:v2>v1,draw=Math.abs(v1-v2)<.0001;
 const tip1=vsContributor(a,k),tip2=vsContributor(b,k);
 return `<div class="vs-row" tabindex="0" title="${a.name} 주요 선수: ${safe(tip1)} / ${b.name} 주요 선수: ${safe(tip2)}"><div class="vs-left" style="${styleTeam(a)}">${win1?'<span class="winner">우세</span>':''}<b class="vs-value">${fmt(k,v1)}</b><div class="vs-track"><span class="vs-fill" style="width:${w1}%"></span></div><span class="vs-extra-tooltip">${safe(tip1)}</span></div><div class="vs-center">${label}${low?'<span class="vs-small">↓ 낮을수록 좋음</span>':''}${draw?'<span class="vs-small">동일</span>':''}</div><div class="vs-right" style="${styleTeam(b)}"><div class="vs-track"><span class="vs-fill" style="width:${w2}%"></span></div><b class="vs-value">${fmt(k,v2)}</b>${win2?'<span class="winner">우세</span>':''}<span class="vs-extra-tooltip">${safe(tip2)}</span></div></div>`;
 }).join('')}</div><div class="tiny muted" style="margin-top:10px">그래프 수치는 팀 합계이며 아래 선수 이름은 해당 지표의 대표 선수 예시. 정확한 기여 기록은 공식 데이터 연결 후 제공 예정.</div>`:''}<section class="vs-top3-section"><div class="head-row"><h3 class="section-title">선수 TOP 3</h3><span class="tag">${role==='pitcher'?'탈삼진':'홈런'} 기준 · 시연용</span></div><div class="vs-top3-columns">${vsTopPlayers(a,role)}${vsTopPlayers(b,role)}</div></section>${selected!=='season'?`<hr class="inner-divider"><div class="head-row"><h3 class="section-title">경기별 결과</h3><button class="btn sm" data-match-sort>${state.matchOrder==='desc'?'최신순 ↓':'오래된순 ↑'}</button></div>${(state.matchOrder==='desc'?Array.from({length:5},(_,i)=>5-i):Array.from({length:5},(_,i)=>i+1)).map(i=>{
 const scoreA=2+hash(a.id+i)%7,scoreB=2+hash(b.id+i)%7,draw=scoreA===scoreB;
 const winner=scoreA>scoreB?a:b,loser=scoreA>scoreB?b:a;
 const wp=PLAYERS.find(p=>p.team===winner.id&&p.role==='pitcher'),lp=PLAYERS.find(p=>p.team===loser.id&&p.role==='pitcher');
 return `<div class="game-row"><button class="game-btn" data-match="${i}"><span class="muted small">2026.${String(3+i).padStart(2,'0')}.${String(5+i*3).padStart(2,'0')} · 예시</span><span class="game-side-result">${a.id} ${scoreA} ${draw?'':`<span class="game-result-stamp ${scoreA>scoreB?'':'lose'}">${scoreA>scoreB?'승':'패'}</span>`} : ${scoreB} ${b.id} ${draw?'<span class="game-result-stamp">무</span>':`<span class="game-result-stamp ${scoreB>scoreA?'':'lose'}">${scoreB>scoreA?'승':'패'}</span>`} ${state.openMatch===i?'⌃':'⌄'}</span><span class="game-pitchers">${draw?'무승부 · 승리·패전투수 없음':`승리투수: ${safe(wp?.name||'확인 전')} · 패전투수: ${safe(lp?.name||'확인 전')}`} (시연용)</span></button>${state.openMatch===i?matchBoard(a,b,i,scoreA,scoreB):''}</div>`;
 }).join('')}`:''}`;
}
function matchBoard(a,b,idx,totalA,totalB){const scores=(total,seed)=>{let arr=Array(9).fill(0);for(let i=0;i<total;i++)arr[hash(seed+'i'+i)%9]++;return arr};const x=scores(totalA,a.id+idx),y=scores(totalB,b.id+idx);return `<div class="scoreboard"><table><thead><tr><th>팀</th>${Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th><th>H</th><th>E</th><th>B</th></tr></thead><tbody>${[[a,x,totalA],[b,y,totalB]].map(([t,arr,tot])=>`<tr><th>${t.id}</th>${arr.map(v=>`<td>${v}</td>`).join('')}<td><b>${tot}</b></td><td>${tot+5}</td><td>${hash(t.id+idx)%3}</td><td>${2+hash(t.id+idx+'bb')%5}</td></tr>`).join('')}</tbody></table></div>`}
function filteredPlayers(){let pool=PLAYERS.filter(p=>p.had2026||state.search.trim().length>0);if(state.search.trim())pool=pool.filter(p=>p.name.toLowerCase().includes(state.search.trim().toLowerCase()));if(state.club)pool=pool.filter(p=>p.team===state.club);if(state.role!=='all')pool=pool.filter(p=>p.role===state.role);if(state.position!=='all')pool=pool.filter(p=>p.position===state.position);if(state.sort)pool.sort((a,b)=>{let av=a[state.sort],bv=b[state.sort];if(av===undefined)return 1;if(bv===undefined)return -1;let d=LOW.includes(state.sort)?av-bv:bv-av;return d||a.name.localeCompare(b.name,'ko')});else pool.sort((a,b)=>TEAMS.findIndex(t=>t.id===a.team)-TEAMS.findIndex(t=>t.id===b.team)||a.name.localeCompare(b.name,'ko'));return pool}
function playersPage(){const pool=filteredPlayers(),rows=state.showAll?pool:pool.slice(0,12);let grouped=!state.sort;let visibleTeams=state.club?TEAMS.filter(t=>t.id===state.club):TEAMS;return `<div class="head-row"><h1 class="page-title">선수 검색</h1><span class="tag">2026 · 시연용</span></div><div class="surface search-tools"><div class="search-top"><input id="searchName" class="search-input" placeholder="선수 이름 검색" value="${safe(state.search)}" aria-label="선수 이름 검색"></div><div class="search-bottom"><button class="pill ${state.role==='all'?'active':''}" data-search-role="all">전체</button><select class="select" id="clubFilter" aria-label="구단 선택"><option value="">구단 선택 · 전체</option>${TEAMS.map(t=>`<option value="${t.id}" ${state.club===t.id?'selected':''}>${t.name}</option>`).join('')}</select><button class="pill ${state.role==='hitter'?'active':''}" data-search-role="hitter">타자</button><button class="pill ${state.role==='pitcher'?'active':''}" data-search-role="pitcher">투수</button><div class="grow"></div><button class="btn sm" id="clearFilters">초기화</button></div><div class="filter-dynamic"><span class="filter-label">정렬</span>${state.role==='all'?'<span class="muted tiny">타자 또는 투수를 선택하면 기록별 정렬이 나타납니다.</span>':`${state.role==='hitter'?`<select id="positionFilter" class="select"><option value="all">전체 포지션</option>${['내야수','외야수','포수','지명타자'].map(q=>`<option value="${q}" ${state.position===q?'selected':''}>${q}</option>`).join('')}</select>`:''}${SORTS[state.role].map(([k,label])=>`<button class="pill ${state.sort===k?'active':''}" data-sort="${k}">${label}</button>`).join('')}`}</div></div><div class="result-head"><span class="label">검색 결과 <strong style="color:var(--navy)">${pool.length}</strong>명</span><div class="inline-controls"><span class="tiny muted">카드 배치</span><button class="pill ${state.cardCols===3?'active':''}" data-cols="3">3열</button><button class="pill ${state.cardCols===4?'active':''}" data-cols="4">4열</button></div></div><div class="search-results">${!pool.length?'<div class="surface empty">검색 결과가 없습니다.</div>':grouped?visibleTeams.map(t=>{let all=rows.filter(p=>p.team===t.id);if(!all.length)return '';return `<section class="club-group"><div class="result-head"><button class="btn ghost result-name" data-collapse="${t.id}">${logo(t,'sm')}${t.name} <span class="tiny muted">${state.collapsed.has(t.id)?'⌄':'⌃'}</span></button></div>${state.collapsed.has(t.id)?'':`<div class="result-grid ${state.cardCols===4?'four':''}">${all.map(p=>playerCard(p)).join('')}</div>`}</section>`}).join(''):`<div class="result-grid ${state.cardCols===4?'four':''}">${rows.map((p,i)=>playerCard(p,i)).join('')}</div>`}${!state.showAll&&pool.length>12?`<button class="btn all-btn" id="showAll">전체 보기 (${pool.length}명)</button>`:state.showAll&&pool.length>12?`<button class="btn all-btn" id="showAll">접기 (12명)</button>`:''}</div>`}
function compareAverage(role,k){const pool=PLAYERS.filter(p=>p.role===role&&p.had2026&&p[k]!==undefined);return pool.reduce((a,b)=>a+b[k],0)/(pool.length||1)}
// 포지션별 비교 기준은 현재 시연용 데이터의 포지션 평균. 공식 리그 평균으로 교체 예정.
const CARD_HITTER_KEYS=['avg','hits','hr','rbi','bb','ops'];
const CARD_PITCHER_KEYS=['era','k','whip','innings','wins','bba'];
function positionMetricAverage(p,k){
 const pool=PLAYERS.filter(x=>x.had2026&&x.role===p.role&&x.position===p.position&&Number.isFinite(x[k]));
 return pool.length?pool.reduce((sum,x)=>sum+x[k],0)/pool.length:null;
}
function statBars(p,keys,detail=false){
 return `<div class="stat-bars ${detail?'stat-bars-large':''}">${keys.filter(k=>Number.isFinite(p[k])).map(k=>{
 const avg=positionMetricAverage(p,k),val=p[k],low=LOW.includes(k);
 // 낮을수록 유리한 지표도 원래 수치를 표시하고 평균선만 함께 제공
 const max=Math.max(val,avg||0,0.01)*1.14;
 const width=100*val/max,mark=avg===null?0:100*avg/max;
 return `<div class="stat-bar-row" title="${LABELS[k]} ${fmt(k,val)} · ${p.position} 평균 ${avg===null?'없음':fmt(k,avg)} · ${low?'낮을수록 유리':'높을수록 유리'}"><div class="stat-bar-label"><span>${LABELS[k]} ${low?'↓':'↑'}</span><b>${fmt(k,val)}</b></div><div class="stat-track"><span class="stat-fill" style="width:${width.toFixed(1)}%;${low&&avg!==null&&val>avg?'background:#a7b1bd;':''}"></span>${avg===null?'':`<span class="stat-average" style="left:${mark.toFixed(1)}%"></span>`}</div><small>${p.position} 평균 ${avg===null?'없음':fmt(k,avg)}</small></div>`
 }).join('')}</div>`;
}
function playerActionPortrait(p){
 // 실제 사진 파일 경로를 p.actionPhoto에 부여하면 해당 사진 표시. 제공되지 않았으면 시연용 아이콘.

}

 <div class="flip-face front"><div class="flip-photo"><span class="silhouette">👤</span><span class="team-badge">${logo(t,'sm')}</span>${ranking?`<span class="rank-tag">${ranking}위</span>`:''}<span class="turn-hint">⟳</span></div><div class="flip-info"><div class="person-title">${safe(p.name)} <span class="tag">${p.number}</span></div><div class="person-sub">${p.position}</div>${unavailable?'<div class="note-box" style="margin-top:15px">2026시즌 1군 기록 없음</div>':`<div class="flip-stats">${metrics.map(k=>`<div class="flip-stat"><label>${LABELS[k]}</label><b>${fmt(k,p[k])}</b></div>`).join('')}</div>`}</div></div>
 <div class="flip-face back"><div class="back-photo">${playerActionPortrait(p)}</div><div class="back-overlay"></div><div class="back-main back-summary"><h3>${safe(p.name)} <span class="tag">${p.position}</span></h3>${unavailable?'<div class="note-box" style="margin-top:18px">2026시즌 1군 기록 없음</div>':`<div class="back-summary-stats">${metrics.slice(0,3).filter(k=>Number.isFinite(p[k])).map(k=>`<div class="back-summary-stat"><span>${LABELS[k]}</span><strong>${fmt(k,p[k])}</strong></div>`).join('')}</div><button class="detail-link" data-open-player="${p.id}">상세 기록 보기 →</button>`}</div></div>
 </div></div>`;
}
function playerDetailPage(){
 const p=PLAYERS.find(x=>x.id===state.selectedPlayer);
 if(!p)return '<div class="empty">선수를 선택해 주세요.</div>';

(b=>b.onclick=()=>{state.matchOrder=state.matchOrder==='desc'?'asc':'desc';render()});if($('searchName')){let f=$('searchName');f.addEventListener('input',()=>{const caret=f.selectionStart;state.search=f.value;state.showAll=false;state.flipped=null;render();let n=$('searchName');n.focus();n.setSelectionRange(caret,caret)})}if($('clubFilter'))$('clubFilter').onchange=e=>{state.club=e.target.value;state.showAll=false;state.flipped=null;render()};if($('positionFilter'))$('positionFilter').onchange=e=>{state.position=e.target.value;state.showAll=false;render()};document.querySelectorAll('[data-search-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.searchRole;state.sort='';state.position='all';state.showAll=false;state.flipped=null;render()});document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.sort=state.sort===b.dataset.sort?'':b.dataset.sort;state.showAll=false;state.flipped=null;render()});if($('clearFilters'))$('clearFilters').onclick=()=>{state.search='';state.club='';state.role='all';state.sort='';state.position='all';state.showAll=false;state.flipped=null;state.collapsed.clear();render()};document.querySelectorAll('[data-cols]').forEach(b=>b.onclick=()=>{state.cardCols=Number(b.dataset.cols);localStorage.setItem('kbo-cols',state.cardCols);state.flipped=null;render()});document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=()=>{let k=b.dataset.collapse;if(state.collapsed.has(k))state.collapsed.delete(k);else state.collapsed.add(k);render()});if($('showAll'))$('showAll').onclick=()=>{state.showAll=!state.showAll;render()};document.querySelectorAll('[data-card]').forEach(b=>{function flip(e){if(e.target.closest('[data-open-player]'))return;state.flipped=state.flipped===Number(b.dataset.card)?null:Number(b.dataset.card);document.querySelectorAll('.flip-card').forEach(el=>el.classList.toggle('flipped',Number(el.dataset.card)===state.flipped))}b.addEventListener('click',flip);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.k
