function initGlobalGlossary(){
 const inp=document.getElementById('globalTermInput'),panel=document.getElementById('globalTermResults');
 if(!inp||!panel)return;
 const esc=(s)=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
 let active=false;
 function update(){
  const query=inp.value.trim().toLocaleLowerCase('ko-KR');
  const found=SEARCH_TERMS.filter(([name,desc])=>!query||(`${name} ${desc}`).toLocaleLowerCase('ko-KR').includes(query));
  const matches=(query?found:SEARCH_TERMS.filter(([n])=>['OPS','WHIP','타율','평균자책점','볼넷','탈삼진'].includes(n))).slice(0,12);
  panel.hidden=!active;
  inp.setAttribute('aria-expanded',String(active));
  if(!active)return;
  panel.innerHTML=matches.length?`<div class="global-result-label">${query?'검색 결과':'자주 찾는 용어'} · ${matches.length}개</div>${matches.map(([name,desc])=>{
   const guide=termGuide(name,desc),arrow=TERM_DIRECTION[name]||'';
   return `<article class="global-guide-card"><div class="global-guide-head"><b>${esc(name)}</b>${dexSeen('terms',name)?'<span class="dex-visited">✓ 저장됨</span>':''}<span class="global-guide-type">${esc(guide.type)}</span></div>
    <p class="global-guide-meaning">${esc(guide.meaning)}</p>
    ${arrow?`<div class="global-guide-direction">${esc(arrow.replace('좋음','유리'))}</div>`:''}
    ${guide.example?`<div class="global-guide-example">${esc(guide.example)}</div>`:''}
    <div class="global-guide-footer"><span>${esc(guide.target)}</span><button class="dex-save" type="button" data-term-save="${esc(name)}">${dexSeen('terms',name)?'저장됨 ✓':'도감에 저장 +'}</button><button class="global-jump" type="button" data-term-jump="${esc(name)}">기록에서 확인 →</button></div>
   </article>`;
  }).join('')}`:'<div class="global-empty">일치하는 용어 없음 · 다른 검색어 입력</div>';
 }
 panel.addEventListener('click',e=>{const save=e.target.closest('[data-term-save]');if(save){dexMark('terms',save.dataset.termSave);update();return}const b=e.target.closest('[data-term-jump]');if(!b)return;active=false;update();jumpToTerm(b.dataset.termJump);});
 inp.addEventListener('focus',()=>{active=true;update()});
 inp.addEventListener('input',()=>{active=true;update()});
 inp.addEventListener('keydown',e=>{if(e.key==='Escape'){active=false;update();inp.blur()}});
 document.addEventListener('pointerdown',e=>{if(!e.target.closest('.global-term-inner')){active=false;update()}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&& !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();inp.focus()}});
}

g"><summary>최근 경기 기록</summary>${g.log.map(v=>`<div>${safe(v)}</div>`).join('')}</details></section>`;

 const g=umpGame;

function startUmpMatch(hidden=false){stopGameTimers();gameShoutOpen=false;umpGame=freshMatch(hidden);recordAudience(umpGame);render();}
function gameContinue(){const g=umpGame;if(!g||g.ended)return;if(g.feedback){g.feedback=null;g.decision=null;}stopGameTimers();startAutoFlow(1);render();}
function hiddenAction(idx){
 const g=umpGame;if(!g||g.ended)return;
 // Strategy affects the first plate appearance; remaining at-bats are simulated normally.
 const offense=currentAttack(g)===hiddenTeam;
 if(offense){
  if(idx===0)applyBatterOutcome(g,gr(.46)?'single':'out');
  else if(idx===1)applyBatterOutcome(g,gr(.20)?'homer':gr(.25)?'double':'out');
  else if(idx===2){if(g.bases.some(Boolean)&&g.outs<2){g.outs++;g.bases=[false,g.bases[0],g.bases[1]];eventLog(g,'희생번트')}else applyBatterOutcome(g,'out')}
 }else{
  if(idx===0)applyBatterOutcome(g,gr(.48)?'strikeout':'single');
  else if(idx===1)applyBatterOutcome(g,gr(.55)?'out':'walk');
  else applyBatterOutcome(g,gr(.72)?'out':'single');
 }
 if(!g.ended&&g.phase!=='intro'&&g.outs<3&&gr(.55))autoPlayOne(g);
 recordAudience(g);render();
 startAutoFlow(1);
}
function wireUmpGame(){
 document.querySelectorAll('[data-learn-mode]').forEach(b=>b.onclick=()=>{learnState.mode=b.dataset.learnMode;render()});
 if($('gameStart'))$('gameStart').onclick=()=>startUmpMatch(false);
 if($('gameResetMenu'))$('gameResetMenu').onclick=()=>{stopGameTimers();umpGame=null;render()};
 if($('gameContinue'))$('gameContinue').onclick=gameContinue;
 if($('gameFastForward'))$('gameFastForward').onclick=()=>{const g=umpGame;if(!g)return;stopGameTimers();prepareGameTurn(g,true);render();startAutoFlow(2)};
 if($('hiddenTeamStart'))$('hiddenTeamStart').onclick=()=>{umpGame=null;learnState.mode='umpire';document.getElementById('app').innerHTML=learnGamePage().replace('GAME START','GAME START');
  const modal=document.getElementById('modalRoot');modal.innerHTML=`<div class="modal-overlay"><div class="modal-card" style="padding:26px;max-width:480px"><h2>?? 해금 · 팀 선택</h2><p>직접 공격·수비 모드</p><div class="gm-options"><button class="btn" data-hidden-team="0">🐥 서울 삑삑이즈</button><button class="btn" data-hidden-team="1">🐦 과학 오목눈이즈</button></div><button class="btn" id="hiddenCancel">닫기</button></div></div>`;
  modal.querySelectorAll('[data-hidden-team]').forEach(b=>b.onclick=()=>{hiddenTeam=Number(b.dataset.hiddenTeam);modal.innerHTML='';startUmpMatch(true)});modal.querySelector('#hiddenCancel').onclick=()=>{modal.innerHTML='';render()};
 };
 if($('hiddenContinue'))$('hiddenContinue').onclick=()=>{umpGame.phase='play';render();startAutoFlow(1)};
 document.querySelectorAll('[data-hidden-act]').forEach(b=>b.onclick=()=>hiddenAction(Number(b.dataset.hiddenAct)));
 document.querySelectorAll('[data-gm-call]').forEach(b=>b.onclick=()=>{const g=umpGame;if(!g||g.feedback)return;stopGameTimers();const correct=b.dataset.gmCall===g.decision.answer;g.calls++;if(!correct)g.errors++;const e=g.decision;g.feedback={correct};resolveDecision(g,e);recordAudience(g);render()});
 if($('shoutToggle'))$('shoutToggle').onclick=()=>{gameShoutOpen=!gameShoutOpen;render()};
 if($('shoutSend'))$('shoutSend').onclick=()=>{const i=Number($('shoutList').value);umpGame.fan=CROWD_CHANTS[i];gameShoutOpen=false;render()};
 document.querySelectorAll('[data-bell-answer]').forEach(b=>b.onclick=()=>{if(learnState.bellAnswered)return;const correct=Number(b.dataset.bellAnswer)===BELL_QUESTIONS[learnState.bellStep].answer;if(correct)learnState.bellCorrect++;learnState.bellAnswered={correct};render()});
 if($('bellNext'))$('bellNext').onclick=()=>{learnState.bellStep++;learnState.bellAnswered=null;render()};
 if($('bellRestart'))$('bellRestart').onclick=()=>{learnState.bellStep=0;learnState.bellCorrect=0;learnState.bellAnswered=null;render()};
 document.querySelectorAll('[data-bell-term]').forEach(b=>b.onclick=()=>{learnState.termQuery=b.dataset.bellTerm;render();});
}

function learnGamePage(){return `<div class="head-row"><h1 class="page-title">GAME⚾️</h1><span class="tag">시연용 가상 경기</span></div><div class="learn-tabs"><button class="learn-tab ${learnState.mode==='umpire'?'active':''}" data-learn-mode="umpire">⚖ 오늘은 내가 심판!</button><button class="learn-tab ${learnState.mode==='bell'?'active':''}" data-learn-mode="bell">🔔 야구용어 골든벨</button></div>${learnState.mode==='umpire'?umpirePage():bellPage()}`;}

function renderLearnTerms(){const q=learnState.termQuery.trim().toLowerCase();if(!q)return `<div class="muted small">용어를 입력하면 짧은 설명이 나와.</div>`;const match=SEARCH_TERMS.filter(([name,desc])=>`${name} ${desc}`.toLowerCase().includes(q));return match.length?match.slice(0,9).map(([n,d])=>`<div class="learn-term"><b>${safe(n)}${TERM_DIRECTION[n]?`<small class="learn-direction">${safe(TERM_DIRECTION[n])}</small>`:""}</b><span>${safe(d)}</span></div>`).join(''):'<div class="muted small">일치하는 용어가 없어.</div>'}

function advanceRunners(kind){const s=learnState;if(kind==='walk'){if(s.bases[0]&&s.bases[1]&&s.bases[2])s.runs++;s.bases[2]=s.bases[2]||(s.bases[0]&&s.bases[1]);s.bases[1]=s.bases[1]||s.bases[0];s.bases[0]=true;}else if(kind==='single'){if(s.bases[2])s.runs++;s.bases=[true,s.bases[0],s.bases[1]];}}
function applyUmpireEvent(e){const s=learnState;if(e.kind==='pitch'){if(e.answer==='볼'){s.balls++;if(s.balls===4){advanceRunners('walk');s.balls=0;s.strikes=0}}else{s.strikes++;if(s.strikes===3){s.outs++;s.balls=0;s.strikes=0}}}else if(e.kind==='foul'){s.strikes=Math.min(2,s.strikes+1)}else if(e.play==='safe'){advanceRunners('single');s.balls=0;s.strikes=0;}else if(e.play==='tag'){s.outs++;s.bases[0]=false;s.balls=0;s.strikes=0;}else if(e.play==='fly'){s.outs++;s.balls=0;s.strikes=0;} }
function bellPage(){const done=learnState.bellStep>=BELL_QUESTIONS.length;const item=BELL_QUESTIONS[learnState.bellStep];return `<section class="learn-game surface learn-bell"><div class="learn-scorebar"><span class="learn-inning">야구용어 골든벨</span><span>${Math.min(learnState.bellStep+1,BELL_QUESTIONS.length)} / ${BELL_QUESTIONS.length}</span><span>정답 ${learnState.bellCorrect}</span></div>${done?`<div class="learn-finish"><div class="learn-finish-icon">🔔</div><h2>골든벨 완료!</h2><p>총 ${BELL_QUESTIONS.length}문제 중 ${learnState.bellCorrect}문제를 맞혔어.</p><button class="btn primary" id="bellRestart">다시 도전</button></div>`:`<div class="learn-bell-inner"><div class="learn-bell-mark">🔔</div><span class="learn-kicker">QUESTION ${learnState.bellStep+1} · ${item.term}</span><h2>${item.q}</h2><div class="learn-bell-options">${item.options.map((v,i)=>`<button class="learn-option" data-bell-answer="${i}" ${learnState.bellAnswered?'disabled':''}>${v}</button>`).join('')}</div>${learnState.bellAnswered?`<div class="learn-feedback ${learnState.bellAnswered.correct?'good':'wrong'}"><strong>${learnState.bellAnswered.correct?'정답!':'정답: '+item.options[item.answer]}</strong><div>${item.why}</div><button class="learn-term-jump" data-bell-term="${item.term}">용어 검색에서 보기 ↗</button></div><button id="bellNext" class="btn primary learn-next">다음 문제 →</button>`:''}</div>`}</section>`}
function wireLearnGame(){wireUmpGame();}

// VERIFIED_OFFLINE: all records displayed in the deployed page must be embedded, never fetched at runtime.
// Game-by-game archive and daily rank calculations remain unavailable until the full 720-game archive is independently verified.
let MATCHES_2026=null, MATCHES_STATUS='not_collected', STANDINGS_HISTORY=null;
const GAME_NAMES={kia:'KIA',kt:'KT',lg:'LG',samsung:'삼성',hanwha:'한화',doosan:'두산',lotte:'롯데',ssg:'SSG',kiwoom:'키움',nc:'NC'};
function matchTeam(x){const raw=String(x?.team?.name||x?.team?.abbrev||x?.name||'').toLowerCase().replace(/[^a-z]/g,'');for(const [k,v] of Object.entries(GAME_NAMES)){if(raw.includes(k))return v;}return null;}
function resultPairs(){return Array.isArray(MATCHES_2026)?MATCHES_2026:[]}
function matchSchedule(){return resultPairs().filter(g=>g.isFinal===true&&!g.isPostseason&&g.officialDate&&Number.isFinite(g.teams?.away?.score)&&Number.isFinite(g.teams?.home?.score))}
function buildHistory(){
 const games=matchSchedule().sort((a,b)=>String(a.officialDate).localeCompare(String(b.officialDate)));
 const byDay=new Map();for(const g of games){let arr=byDay.get(g.officialDate)||[];arr.push(g);byDay.set(g.officialDate,arr)}
 const result={};const stats=Object.fromEntries(TEAMS.map(t=>[t.id,{w:0,l:0,d:0}]));
 for(const day of [...byDay.keys()].sort()){
  for(const g of byDay.get(day)){
   const away=matchTeam(g.teams.away),home=matchTeam(g.teams.home);if(!away||!home)continue;
   const a=g.teams.away.score,b=g.teams.home.score;
   if(a===b){stats[away].d++;stats[home].d++;}else{stats[away][a>b?'w':'l']++;stats[home][a>b?'l':'w']++;}
  }
  const order=TEAMS.map(t=>t.id).sort((a,b)=>{
   const wa=stats[a].w/(stats[a].w+stats[a].l||1),wb=stats[b].w/(stats[b].w+stats[b].l||1);
   return wb-wa||stats[b].w-stats[a].w||a.localeCompare(b,'ko');
  });
  result[day]=Object.fromEntries(order.map((id,i)=>[id,{rank:i+1,...stats[id]}]));
 }
 return result;
}
function getHistoricalRank(t,date){
 if(!STANDINGS_HISTORY)return null;
 let keys=Object.keys(STANDINGS_HISTORY).filter(k=>k<=date).sort();
 return keys.length?(STANDINGS_HISTORY[keys[keys.length-1]][t.id]||null):null;
}
function monthlyGames(t,m){const games=matchSchedule().filter(g=>g.officialDate.startsWith(`2026-${String(m).padStart(2,'0')}-`)&&(matchTeam(g.teams.away)===t.id||matchTeam(g.teams.home)===t.id));
 let w=0,l=0,d=0,runs=0,allowed=0;
 for(const g of games){const isAway=matchTeam(g.teams.away)===t.id;const a=isAway?g.teams.away.score:g.teams.home.score,b=isAway?g.teams.home.score:g.teams.away.score;runs+=a;allowed+=b;if(a>b)w++;else if(a<b)l++;else d++;}
 return {games:games.length,wins:w,loses:l,draws:d,pct:w/(w+l||1),runs,allowed};
}
function h2hGames(a,b){return matchSchedule().filter(g=>new Set([matchTeam(g.teams.away),matchTeam(g.teams.home)]).size===2&&[matchTeam(g.teams.away),matchTeam(g.teams.home)].includes(a.id)&&[matchTeam(g.teams.away),matchTeam(g.teams.home)].includes(b.id));}

 const width=100*val/max,mark=avg===null?0:100*avg/max;
 return `<div class="stat-bar-row" title="${LABELS[k]} ${fmt(k,val)} · 확인 선수 평균 ${avg===null?'없음':fmt(k,avg)} · ${low?'낮을수록 유리':'높을수록 유리'}"><div class="stat-bar-label"><span>${LABELS[k]} ${low?'↓':'↑'}</span><b>${fmt(k,val)}</b></div><div class="stat-track"><span class="stat-fill" style="width:${width.toFixed(1)}%;${low&&avg!==null&&val>avg?'background:#a7b1bd;':''}"></span>${avg===null?'':`<span class="stat-average" style="left:${mark.toFixed(1)}%"></span>`}</div><small>확인 선수 평균 ${avg===null?'없음':fmt(k,avg)}</small></div>`
 }).join('')}</div>`;
}
function playerActionPortrait(p){
 // 실제 사진 파일 경로를 p.actionPhoto에 부여하면 해당 사진 표시. 제공되지 않았으면 시연용 아이콘.
 return `<div class="action-portrait">${p.actionPhoto?`<img src="${safe(p.actionPhoto)}" alt="${safe(p.name)} 경기 중 모습" loading="lazy">`:`<span class="action-icon" aria-hidden="true">${p.role==='pitcher'?'⚾':'🏏'}</span><span class="action-photo-label">플레이 사진 적용 예정</span>`}</div>`;
}
function playerCard(p,ix){
 const t=TEAM_MAP[p.team],metrics=RELEVANT[state.sort]&&p[state.sort]!==undefined?RELEVANT[state.sort]:(p.role==='hitter'?['avg','hits','hr']:['era','k','whip']);
 const ranking=state.sort&&ix!==undefined&&ix<3?ix+1:null,unavailable=!p.had2026;
 return `<div class="flip-card ${state.flipped===p.id?'flipped':''}" style="${styleTeam(t)}" data-card="${p.id}" tabindex="0" role="button" aria-label="${safe(p.name)} 카드 뒤집기"><div class="flip-inner">
 <div class="flip-face front"><div class="flip-photo"><span class="silhouette">👤</span><span class="team-badge">${logo(t,'sm')}</span>${ranking?`<span class="rank-tag">${ranking}위</span>`:''}<span class="turn-hint">⟳</span></div><div class="flip-info"><div class="person-title">${safe(p.name)} ${p.number==='—'?'':`<span class="tag">${p.number}</span>`}</div><div class="person-sub">${p.position}</div>${unavailable?'<div class="note-box" style="margin-top:15px">2026시즌 1군 기록 없음</div>':`<div class="flip-stats">${metrics.map(k=>`<div class="flip-stat"><label>${LABELS[k]}</label><b>${fmt(k,p[k])}</b></div>`).join('')}</div>`}</div></div>
 <div class="flip-face back"><div class="back-photo">${playerActionPortrait(p)}</div><div class="back-overlay"></div><div class="back-main back-summary"><h3>${safe(p.name)} <span class="tag">${p.position}</span></h3>${unavailable?'<div class="note-box" style="margin-top:18px">2026시즌 1군 기록 없음</div>':`<div class="back-summary-stats">${metrics.slice(0,3).filter(k=>Number.isFinite(p[k])).map(k=>`<div class="back-summary-stat"><span>${LABELS[k]}</span><strong>${fmt(k,p[k])}</strong></div>`).join('')}</div><button class="detail-link" data-open-player="${p.id}">상세 기록 보기 →</button>`}</div></div>
 </div></div>`;
}
function playerDetailPage(){
 const p=PLAYERS.find(x=>x.id===state.selectedPlayer);
 if(!p)return '<div class="empty">선수를 선택해 주세요.</div>';
 const t=TEAM_MAP[p.team],metrics=p.role==='hitter'?HITTER_METRICS:PITCHER_METRICS;
 const related=filteredPlayers().filter(q=>q.had2026);
 const peers=related.length>1?related:PLAYERS.filter(q=>q.had2026&&q.role===p.role&&q.team===p.team);
 return `<div class="player-fullscreen" role="dialog" aria-modal="true" aria-label="${safe(p.name)} 상세 기록" style="${styleTeam(t)}"><div class="player-fullscreen-inner"><article class="player-expanded-card"><button class="player-close" id="backToResults" aria-label="선수 상세 닫기">✕</button><div class="player-expanded-body"><div class="player-expanded-photo">${playerActionPortrait(p)}</div><div class="player-expanded-data"><div class="inline-controls"><span class="tag">2026 시즌 · 공식 기록 일부</span><span class="tag">${p.position}${p.number==='—'?'':' · '+p.number+'번'}</span></div><div class="dex-detail-no">2026 정규시즌 · KBO 공식 기록 확인 선수</div><h1 class="hero-name">${safe(p.name)}</h1><div class="muted">${t.name}</div><div class="player-expanded-stats"><div class="stat-card-caption">공식 기록 확인 항목 · 확인된 선수 표본 평균 비교</div>${statBars(p,p.role==='hitter'?CARD_HITTER_KEYS:CARD_PITCHER_KEYS,true)}<div class="stat-legend"><i></i> 평균선 = 공식 순위표에 수록된 해당 역할 선수 표본의 평균</div></div><div class="player-expanded-visual"><h2 class="section-title">${p.role==='hitter'?'타구 기록':'투구 기록'}</h2>${featurePlayer(p)}</div></div></div></article><aside class="player-peers"><div class="player-peers-heading"><strong>다른 선수</strong><span class="tiny muted">스크롤·스와이프하여 선택</span></div><div class="player-peer-list">${peers.map(q=>`<button class="player-peer ${q.id===p.id?'on':''}" data-peer-player="${q.id}" style="${styleTeam(TEAM_MAP[q.team])}"><span class="player-peer-icon">${q.role==='pitcher'?'⚾':'◉'}</span><span><b>${safe(q.name)}</b><small>${TEAM_MAP[q.team].name} · ${q.position}</small></span></button>`).join('')}</div></aside></div></div>`;
}

 document.querySelectorAll('[data-vs-pitch-all]').forEach(b=>b.onclick=()=>{const club=b.dataset.vsPitchAll;const current=state.vsPitchTypes[club]??VS_PITCHES.map(x=>x.id);state.vsPitchTypes[club]=current.length===VS_PITCHES.length?[]:VS_PITCHES.map(x=>x.id);const y=window.scrollY;render();window.scrollTo(0,y);});

 });document.querySelectorAll('[data-ball]').forEach(b=>{const act=()=>{state.selectedBall=Number(b.dataset.ball);const p=state.page==='playerdetail'?PLAYERS.find(x=>x.id===state.selectedPlayer):teamPlayers(TEAM_MAP[state.activeTeam],state.detailRole).find(q=>q.id===state.detailPlayer)||teamPlayers(TEAM_MAP[state.activeTeam],state.detailRole)[0];const ball=sampleHomeRuns(p).find(x=>x.num===state.selectedBall);if(ball){$('ballTip').innerHTML=`<strong>${ball.num}호 홈런</strong><span>${ball.date}</span><span>${ball.opponent}</span><span>${ball.park}</span><span>${ball.dir}</span><span>비거리 ${ball.d}m</span><span>타구 속도 ${ball.v}km/h</span><span>발사각 ${ball.ang}°</span>`}};b.addEventListener('click',act);b.addEventListener('mouseenter',act);b.addEventListener('focus',act)});document.querySelectorAll('[data-pitch]').forEach(b=>b.onclick=()=>{const k=b.dataset.pitch;if(state.pitchSelected.has(k))state.pitchSelected.delete(k);else state.pitchSelected.add(k);render()});document.querySelectorAll('[data-pitch-view]').forEach(b=>b.onclick=()=>{state.pitchView=b.dataset.pitchView;render()});document.querySelectorAll('[data-pitch-replay]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pitch-path').forEach(p=>{p.style.animation='none';p.getBoundingClientRect();p.style.animation=''})});document.querySelectorAll('[data-vs-team]').forEach(b=>b.onclick=()=>{let k=b.dataset.vsTeam;if(state.vsTeams.includes(k))state.vsTeams=state.vsTeams.filter(x=>x!==k);else if(state.vsTeams.length<2)state.vsTeams.push(k);else state.vsTeams=[state.vsTeams[1],k];render()});if($('vsReset'))$('vsReset').onclick=()=>{state.vsTeams=[];render()};document.querySelectorAll('[data-vs-mode]').forEach(b=>b.onclick=()=>{state.vsMode=b.dataset.vsMode;render()});document.querySelectorAll('[data-vs-role]').forEach(b=>b.onclick=()=>{state.vsRole=b.dataset.vsRole;render()});document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{let i=b.dataset.match;state.openMatch=state.openMatch===i?null:i;render()});document.querySelectorAll('[data-match-sort]').forEach(b=>b.onclick=()=>{state.matchOrder=state.matchOrder==='desc'?'asc':'desc';render()});if($('searchName')){let f=$('searchName');f.addEventListener('input',()=>{const caret=f.selectionStart;state.search=f.value;state.showAll=false;state.flipped=null;render();let n=$('searchName');n.focus();n.setSelectionRange(caret,caret)})}if($('clubFilter'))$('clubFilter').onchange=e=>{state.club=e.target.value;state.showAll=false;state.flipped=null;render()};if($('positionFilter'))$('positionFilter').onchange=e=>{state.position=e.target.value;state.showAll=false;render()};document.querySelectorAll('[data-search-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.searchRole;state.sort='';state.position='all';state.showAll=false;state.flipped=null;render()});document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.sort=state.sort===b.dataset.sort?'':b.dataset.sort;state.showAll=false;state.flipped=null;render()});if($('clearFilters'))$('clearFilters').onclick=()=>{state.search='';state.club='';state.role='all';state.sort='';state.position='all';state.showAll=false;state.flipped=null;state.collapsed.clear();render()};document.querySelectorAll('[data-cols]').forEach(b=>b.onclick=()=>{state.cardCols=Number(b.dataset.cols);localStorage.setItem('kbo-cols',state.cardCols);state.flipped=null;render()});document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=()=>{let k=b.dataset.collapse;if(state.collapsed.has(k))state.collapsed.delete(k);else state.collapsed.add(k);render()});if($('showAll'))$('showAll').onclick=()=>{state.showAll=!state.showAll;render()};document.querySelectorAll('[data-card]').forEach(b=>{function flip(e){if(e.target.closest('[data-open-player]'))return;state.flipped=state.flipped===Number(b.dataset.card)?null:Number(b.dataset.card);document.querySelectorAll('.flip-card').forEach(el=>el.classList.toggle('flipped',Number(el.dataset.card)===state.flipped))}b.addEventListener('click',flip);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip(e)}})});document.querySelectorAll('[data-open-player]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.selectedPlayer=Number(b.dataset.openPlayer);state.searchSnapshot={scroll:window.scrollY};goto('playerdetail')});if($('backToResults'))$('backToResults').onclick=()=>{state.page='players';render();window.scrollTo({top:state.searchSnapshot?.scroll||0,behavior:'instant'})};}
